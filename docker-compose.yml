
services:
  postgres:
    image: postgres:16
    container_name: verse-postgres
    restart: unless-stopped
    ports:
      - 5433:5432
    environment:
      POSTGRES_USER: verse
      POSTGRES_PASSWORD: verse
      POSTGRES_DB: verse_dev
    volumes:
      - verse_pg_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: verse-redis
    restart: unless-stopped
    ports:
      - 6379:6379

volumes:
  verse_pg_data:

