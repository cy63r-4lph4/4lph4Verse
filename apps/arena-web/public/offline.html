<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Offline — Arena</title>
  <style>
    :root { --cyan: #22d3ee; --dark: #050a14; --amber: #f59e0b; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--dark);
      color: #fff;
      font-family: 'Courier New', monospace;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      text-align: center;
    }
    .icon {
      width: 64px; height: 64px;
      margin: 0 auto 2rem;
      color: var(--amber);
      opacity: 0.8;
    }
    .badge {
      font-size: 0.6rem;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: var(--amber);
      background: rgba(245,158,11,0.1);
      border: 1px solid rgba(245,158,11,0.2);
      padding: 0.25rem 0.75rem;
      border-radius: 999px;
      margin-bottom: 1.5rem;
      display: inline-block;
    }
    h1 {
      font-size: clamp(1.5rem, 5vw, 2.5rem);
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      background: linear-gradient(135deg, #fff 0%, var(--cyan) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 1rem;
    }
    p {
      font-size: 0.75rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.4);
      max-width: 36ch;
      line-height: 1.8;
      margin-bottom: 2.5rem;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.75rem 1.75rem;
      border-radius: 0.75rem;
      background: rgba(34,211,238,0.08);
      border: 1px solid rgba(34,211,238,0.25);
      color: var(--cyan);
      font-family: inherit;
      font-size: 0.65rem;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      cursor: pointer;
      text-decoration: none;
      transition: background 200ms, border-color 200ms;
    }
    .btn:hover { background: rgba(34,211,238,0.18); border-color: rgba(34,211,238,0.5); }
    .grid {
      position: fixed; inset: 0; z-index: 0; pointer-events: none;
      background-image:
        linear-gradient(rgba(34,211,238,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(34,211,238,0.03) 1px, transparent 1px);
      background-size: 40px 40px;
    }
    .content { position: relative; z-index: 1; }
    .pulse { animation: pulse 2s ease-in-out infinite; }
    @keyframes pulse { 0%,100%{ opacity:0.5 } 50%{ opacity:1 } }
  </style>
</head>
<body>
  <div class="grid"></div>
  <div class="content">
    <svg class="icon pulse" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <line x1="2" y1="2" x2="22" y2="22"/>
      <path d="M8.5 16.5a5 5 0 0 1 7 0"/>
      <path d="M2 8.82a15 15 0 0 1 4.17-2.65"/>
      <path d="M10.66 5c4.01-.36 8.14.9 11.34 3.76"/>
      <path d="M16.85 11.25a10 10 0 0 1 2.22 1.68"/>
      <path d="M5 13a10 10 0 0 1 5.24-2.76"/>
      <circle cx="12" cy="20" r="1" fill="currentColor"/>
    </svg>
    <span class="badge">Signal Lost</span>
    <h1>No Connection</h1>
    <p>
      You are operating offline. Cached intel is still accessible — navigate back to resume your session.
    </p>
    <a class="btn" href="/" onclick="history.back(); return false;">
      ← Return to last position
    </a>
  </div>
</body>
</html>
