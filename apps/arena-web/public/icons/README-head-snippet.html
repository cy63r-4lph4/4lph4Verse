<!-- Drop these files into your /public folder, then add this to <head> -->

<link rel="icon" type="image/x-icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="48x48" href="/favicon-48x48.png">
<link rel="icon" type="image/png" sizes="96x96" href="/favicon-96x96.png">

<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">

<link rel="manifest" href="/site.webmanifest">
<meta name="theme-color" content="#09132a">

<!--
Files in this pack:
  favicon.ico                     - multi-size (16/32/48) classic favicon
  favicon-16x16.png                - browser tab (small)
  favicon-32x32.png                - browser tab (standard)
  favicon-48x48.png                - browser tab / taskbar
  favicon-96x96.png                - larger tab / desktop shortcuts
  icon-256x256.png                 - general-purpose icon (e.g. OG fallback, app listings)
  apple-touch-icon.png (180x180)   - iOS home screen icon
  android-chrome-192x192.png       - Android home screen icon
  android-chrome-512x512.png       - Android splash / high-res icon
  maskable-icon-512x512.png        - Android adaptive icon (safe-zone padded so it
                                       survives circular/squircle cropping)
  site.webmanifest                 - PWA manifest referencing the icons above
-->
